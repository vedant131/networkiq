<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 56" fill="none">
  <defs>
    <!-- Cyan glow filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Subtle shadow -->
    <filter id="softglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Pulse / signal wave icon -->
  <polyline
    points="4,28 14,28 19,12 25,44 31,28 41,28"
    stroke="#00e5ff"
    stroke-width="2.2"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
    filter="url(#glow)"
  />

  <!-- Vertical separator -->
  <line x1="50" y1="10" x2="50" y2="46" stroke="#00e5ff" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>

  <!-- "NetWorkIQ" text -->
  <text
    x="60"
    y="37"
    font-family="'Courier New', Courier, monospace"
    font-size="22"
    font-weight="700"
    fill="#00e5ff"
    letter-spacing="1"
    filter="url(#softglow)"
  >NetWorkIQ</text>
</svg>
